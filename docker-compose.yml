# The project's name, whatever folder it is cloned into: its volumes are webnavi_*.
name: webnavi

services:
  nav:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WORK_DIR: /work
      # Our own routes: OSRM over 표준노드링크 (the osrm service below).
      KOREA_OSRM_URL: http://osrm:5000
    volumes:
      - ./server/data:/data:ro
      # Keys typed on /admin, encrypted; the master key sits beside them.
      - nav_config:/config
      # Phrases rendered once, kept across rebuilds.
      - nav_tts:/tts
      # What tools/hdmap/build.py builds from 정밀도로지도 (it runs on the host, against the raw zips there).
      - /mnt/data/webnavi:/work
    expose: ["8080"]
    # Plain http on the LAN; a Cloudflare Tunnel on this host points here for https.
    ports: ["8088:8080"]

  # Our own router: OSRM over 표준노드링크, the graph tools/nodelink/build.py
  # makes on the host under /mnt/data/webnavi/nodelink. Reached only by nav.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    # serve.sh: the graph in shared memory, and the live speeds nav writes (speeds.csv) folded in
    # as they change. The graph is about 1.5 GB in shared memory, twice while it is swapped.
    command: sh /serve.sh
    shm_size: 6g
    volumes:
      - /mnt/data/webnavi/nodelink:/data
      - ./tools/nodelink/serve.sh:/serve.sh:ro
    expose: ["5000"]

  # Not used while a Cloudflare Tunnel ends HTTPS; uncomment to go back to Caddy.
  # # TLS in front: the browser only hands out geolocation and wake lock on
  # # https, so the car must reach this through a real certificate.
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   env_file: .env
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config

volumes:
  nav_config:
  nav_tts:
  # caddy_data:
  # caddy_config:
