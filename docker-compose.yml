# The project's name, whatever folder it is cloned into: its volumes are webnavi_*.
name: webnavi

services:
  nav:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WORK_DIR: /work
      # Our own routes: OSRM over 표준노드링크 (the osrm service below).
      KOREA_OSRM_URL: http://osrm:5000
    volumes:
      - ./server/data:/data:ro
      # Keys typed on /admin (encrypted, the master key beside them), the users' SQLite, the public-data caches:
      # on the host under /mnt/data/webnavi so they can be seen and backed up with the rest (moved from a named
      # volume 2026-10-01).
      - /mnt/data/webnavi/config:/config
      # Every sentence the voice has ever said, as WAV by (voice, text): rendered once, kept for good.
      - /mnt/data/webnavi/tts:/tts
      # What tools/hdmap/build.py builds from 정밀도로지도 (it runs on the host, against the raw zips there).
      - /mnt/data/webnavi:/work
    expose: ["8080"]
    # Plain http on the LAN; a Cloudflare Tunnel on this host points here for https.
    ports: ["8088:8080"]

  # Our own router: OSRM over 표준노드링크, the graph tools/nodelink/build.py
  # makes on the host under /mnt/data/webnavi/nodelink. Reached only by nav.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    # serve.sh: the graph in shared memory, and the live speeds nav writes (speeds.csv) folded in
    # as they change. The graph is about 1.5 GB in shared memory, twice while it is swapped.
    command: sh /serve.sh
    shm_size: 6g
    volumes:
      - /mnt/data/webnavi/nodelink:/data
      - ./tools/nodelink/serve.sh:/serve.sh:ro
    expose: ["5000"]

  # Tesla Fleet Telemetry (server car/fleet.ts): the car streams its speed and odometer here, over mTLS that must
  # end in this container — so on a port of its own, forwarded on the router and with a DNS-only (grey cloud) name,
  # not through the Cloudflare Tunnel. Off unless asked for: `docker compose --profile fleet up -d`.
  # /mnt/data/webnavi/telemetry holds tls.crt / tls.key (readable by uid 65532) and ca.pem, the chain the car is
  # told to trust; fleet/README.md has the steps.
  fleet-telemetry:
    image: tesla/fleet-telemetry:v0.9.5
    profiles: ["fleet"]
    restart: unless-stopped
    volumes:
      - ./fleet/telemetry.json:/etc/fleet-telemetry/config.json:ro
      - /mnt/data/webnavi/telemetry:/etc/certs/server:ro
    ports: ["${TELEMETRY_PORT:-8443}:443"]
    depends_on: [fleet-redis]

  # What fleet-telemetry publishes to and nav listens on; nothing kept (each record is for now or never).
  fleet-redis:
    image: redis:7-alpine
    profiles: ["fleet"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose: ["6379"]

  # Not used while a Cloudflare Tunnel ends HTTPS; uncomment to go back to Caddy.
  # # TLS in front: the browser only hands out geolocation and wake lock on
  # # https, so the car must reach this through a real certificate.
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   env_file: .env
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config

