<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Tesla Nav</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <aside id="hud">
      <div class="big"><span id="speed">--</span><small> km/h</small></div>

      <form id="search-form" class="row" autocomplete="off">
        <input id="q" type="search" placeholder="목적지" enterkeyhint="search" />
        <button type="submit" class="narrow">검색</button>
      </form>
      <ul id="results" hidden></ul>

      <section id="trip" hidden>
        <div id="trip-name"></div>
        <div class="row" id="providers"></div>
        <div id="trip-sum"></div>
        <button id="clear">경로 지우기</button>
      </section>

      <details>
        <summary>진단</summary>
        <dl>
          <dt>위치</dt><dd id="pos">--</dd>
          <dt>정확도</dt><dd id="acc">--</dd>
          <dt>방향</dt><dd id="heading">--</dd>
          <dt>주기</dt><dd id="period">--</dd>
          <dt>수신</dt><dd id="count">0</dd>
          <dt>화면 유지</dt><dd id="wake">--</dd>
          <dt>오디오</dt><dd id="audio">--</dd>
        </dl>
        <div class="row">
          <button id="beep">소리 테스트</button>
          <button id="save">로그 저장</button>
          <label class="button">재생<input id="replay" type="file" accept=".csv" hidden /></label>
        </div>
        <pre id="log"></pre>
      </details>

      <button id="follow" class="on">따라가기</button>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
